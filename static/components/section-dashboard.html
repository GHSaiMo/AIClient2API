<link rel="stylesheet" href="components/section-dashboard.css">
<!-- Dashboard Section -->
<section id="dashboard" class="section active" aria-labelledby="dashboard-title">
    <h2 id="dashboard-title" data-i18n="dashboard.title">系统概览</h2>

    <!-- System Information Panel -->
    <div class="system-info-panel" style="margin-top: 1rem;">
        <div class="system-info-header">
            <h3 data-i18n="dashboard.systemInfo">系统信息</h3>
        </div>
        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-clock"></i> <span data-i18n="dashboard.uptime">运行时间</span>
                </span>
                <div class="version-display-wrapper">
                    <span class="info-value" id="uptime">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-code"></i> <span data-i18n="dashboard.nodeVersion">Node.js版本</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="nodeVersion">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-calendar-alt"></i> <span data-i18n="dashboard.serverTime">服务器时间</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="serverTime">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-desktop"></i> <span data-i18n="dashboard.platform">操作系统</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="platformInfo">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-memory"></i> <span data-i18n="dashboard.memoryUsage">内存使用</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="memoryUsage">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-microchip"></i> <span data-i18n="dashboard.cpuUsage">CPU 使用</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="cpuUsage">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-cogs"></i> <span data-i18n="dashboard.serviceMode">运行模式</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="serviceMode">--</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-label">
                    <i class="fas fa-fingerprint"></i> <span data-i18n="dashboard.processPid">进程 PID</span>
                </span>
                <div class="version-display-wrapper">
                <span class="info-value" id="processPid">--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Provider Nodes Status Panel -->
    <div class="provider-status-panel">
        <div class="system-info-header">
            <h3><i class="fas fa-network-wired"></i> <span data-i18n="dashboard.providerStatus">提供商节点状态</span></h3>
            <button id="refreshProviderStatusBtn" class="btn btn-outline btn-sm" data-i18n-title="common.refresh" title="刷新">
                <i class="fas fa-sync-alt"></i> <span data-i18n="common.refresh">刷新</span>
            </button>
        </div>
        <div id="providerStatusGrid" class="provider-status-grid">
            <!-- Provider status cards will be loaded here -->
            <div class="status-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <span data-i18n="common.loading">加载中...</span>
            </div>
        </div>
    </div>

    <!-- Advanced Information (Collapsible) -->
    <details class="dashboard-details">
        <summary class="dashboard-summary">
            <div class="summary-content">
                <i class="fas fa-cube"></i>
                <span data-i18n="dashboard.advancedInfo">可用模型列表</span>
                <span class="expand-hint" data-i18n="dashboard.expandMore">展开更多</span>
            </div>
            <i class="fas fa-chevron-down caret-icon"></i>
        </summary>

        <div class="routing-examples-panel" style="margin-top: 1rem; border-top: none;">
            <!-- 可用模型列表 -->
            <div class="models-section" style="margin-top: 0;">
                <div class="models-description">
                    <div class="highlight-note">
                        <i class="fas fa-info-circle"></i>
                        <span data-i18n="models.note">点击模型名称可直接复制到剪贴板</span>
                    </div>
                </div>
                
                <!-- Models Container -->
                <div class="models-container">
                    <div id="modelsList" class="models-list">
                        <!-- Models will be loaded here -->
                        <div class="models-loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            <span data-i18n="common.loading">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </details>
    
</section>
